name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Publish app
        run: dotnet publish MyCleaner.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ inputs.version }} -o publish

      - name: Build installer
           run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ inputs.version }}" installer\setup.iss'

      - name: Update version.json, tag and push
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $file = "output/MyCleaner-Setup-$v.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          $info = [ordered]@{
            version = $v
            url     = "https://github.com/${{ github.repository }}/releases/download/v$v/MyCleaner-Setup-$v.exe"
            sha256  = $hash
            notes   = "Release v$v"
          }
          $info | ConvertTo-Json | Set-Content -Path version.json -Encoding utf8
          Write-Host "SHA256: $hash"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          git commit -m "Update version.json to $v"
          git tag "v$v"
          git push origin HEAD:main --tags

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ inputs.version }}"
          gh release create "v$v" "output/MyCleaner-Setup-$v.exe" --title "MyCleaner v$v" --notes "Release v$v"
